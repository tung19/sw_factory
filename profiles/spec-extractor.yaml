# AREA agent profile — see area/profile.py for what this file controls.
#
# This file is DESCRIPTIVE of what the code does today: every `defaults` value is
# null, so adopting profiles changed no behaviour. Tune a value here and it becomes
# the default for this kind (a CLI flag still wins), and the change shows up as a new
# `digest` that `area evals` compares against the previous version's measured runs.

kind: spec-extractor
description: >-
  Turns a requirement into spec.yaml + acceptance.yaml against a fixed schema.

# obs labels this kind owns (globs); how a run is attributed to this profile
labels:
  - "spec"

# dotted names whose SOURCE is hashed into the digest: edit a prompt -> new version
prompt_sources:
  - area.spec.extract._SCHEMA_GUIDE
  - area.spec.extract.extract_spec

skills: none

# applied when the caller passes nothing; null = today's global behaviour
defaults:
  agent_iters: null
  budget_usd: null
  max_iters: null

notes: |
  Second-highest run count in the real log (25/110) — the first kind where evals
  will have enough samples to say anything.
