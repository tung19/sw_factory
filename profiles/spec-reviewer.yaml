# AREA agent profile — see area/profile.py for what this file controls.
#
# This file is DESCRIPTIVE of what the code does today: every `defaults` value is
# null, so adopting profiles changed no behaviour. Tune a value here and it becomes
# the default for this kind (a CLI flag still wins), and the change shows up as a new
# `digest` that `area evals` compares against the previous version's measured runs.

kind: spec-reviewer
description: >-
  Independent spec-vs-intent review; stops on material ambiguity instead of guessing.

# obs labels this kind owns (globs); how a run is attributed to this profile
labels:
  - "spec-review"

# dotted names whose SOURCE is hashed into the digest: edit a prompt -> new version
prompt_sources:
  - area.spec.review._review_prompt
  - area.spec.review.review_spec

skills: none

# applied when the caller passes nothing; null = today's global behaviour
defaults:
  agent_iters: null
  budget_usd: null
  max_iters: null

notes: |
  WHY IT HAD NO MEASURED RUNS (triaged 2026-10-27): a BUG, now fixed. The pipeline
  guard was `clarify and spec_review`, so `--no-clarify` silently switched this
  reviewer off as a side effect — and `--no-clarify` is what you pass for an
  unattended run, so the independent review was disabled precisely when nobody was
  watching. Proof it truly never ran: 5 spec/intake runs happened AFTER the reviewer
  shipped (2026-10-20 15:20) and obs recorded zero `spec-review` runs, even though
  `ask_cli` logs in a `finally` and therefore records failures too. Expect runs from
  now on; `--no-spec-review` is the only way to skip it.
