# AREA agent profile — see area/profile.py for what this file controls.
#
# This file is DESCRIPTIVE of what the code does today: every `defaults` value is
# null, so adopting profiles changed no behaviour. Tune a value here and it becomes
# the default for this kind (a CLI flag still wins), and the change shows up as a new
# `digest` that `area evals` compares against the previous version's measured runs.

kind: holdout-fixer
description: >-
  Fixes APP CODE until the already-locked oracle passes. Never edits the tests.

# obs labels this kind owns (globs); how a run is attributed to this profile
labels:
  - "holdout:fix"

# dotted names whose SOURCE is hashed into the digest: edit a prompt -> new version
prompt_sources:
  - area.verify.holdout.holdout_verify

# Runs with the app directory as its cwd, where the builder's skill pack was installed
# and left behind, so a Claude Code session there discovers it. This kind installs
# nothing itself, but a skill edit can change what it does — so it changes its version.
skills: inherited

# applied when the caller passes nothing; null = today's global behaviour
defaults:
  agent_iters: null
  budget_usd: null
  max_iters: null

notes: |
  Deliberately a different profile from `holdout-author`: same module, opposite role.
  WHY IT HAS NO MEASURED RUNS (triaged 2026-10-27): unreachable on the DEFAULT path,
  by design. It only runs inside the non-TDD `verify` gate, and `--tdd` (the default)
  removes that gate as redundant — the locked holdout is already the build oracle. So
  this profile covers the non-TDD route, which is real but almost never taken. Not a
  bug; it does mean the non-TDD path is unexercised in practice.
