name: CI

# AREA's own CI: run the dogfood test suite (pure orchestrator logic — no live
# agents, no network, no npm) on every push / PR to main. This is the automated
# regression guard called for in PLAN §11 (PR4 "CI cho AREA", PR8 bus-factor):
# the oracle-policy tests (lock/challenge ordering, gate wiring, deploy routing,
# auth gate, iterate composition) must stay green before anything merges.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          # requirements.lock was frozen on macOS, so it pins pyobjc-* — macOS-only
          # packages that cannot build on the Linux runner. Strip them (nothing on
          # Linux requires them; they are darwin-marked in the real dep metadata).
          # Strip pyobjc-* (macOS-only, can't build on Linux) AND openhands-* — the
          # engine is vendored in-tree (git subtree) and installed editable below,
          # so it must NOT be pulled from PyPI (that would shadow the vendored copy).
          grep -ivE '^pyobjc|^openhands-' requirements.lock > requirements.ci.txt
          # The lock is a complete flat resolution, so install it with --no-deps:
          # pip then installs exactly these pins without re-resolving.
          pip install --no-deps -r requirements.ci.txt
          # Engine (OpenHands SDK) vendored in-tree: install the two packages editable
          # from vendor/ so area.engine's module-load imports resolve to the in-tree copy.
          pip install --no-deps -e vendor/software-agent-sdk/openhands-sdk -e vendor/software-agent-sdk/openhands-tools
          # The `area` package itself (editable) — so `import area` + the `area`
          # console script resolve. Deps already satisfied above.
          pip install -e . --no-deps
          # Dev-only (not in the runtime lock).
          pip install pytest==9.1.1

      - name: Syntax check
        run: python -m compileall -q area tests

      - name: Lint (ruff — pyflakes bugs + syntax)
        run: |
          pip install ruff==0.17.1
          ruff check area tests

      - name: Type-check (mypy — phased subset from pyproject)
        run: |
          pip install mypy==2.4.0
          mypy

      - name: Run test suite
        run: python -m pytest

      # The coordinator that actually runs on Cloudflare is JS, not Python, so its
      # access policy (token gate, one-runner-per-channel, relay whitelist) needs
      # its own oracle. Node ships on ubuntu-latest; no deps, no network.
      - name: Coordinator Worker policy tests (Node)
        run: node --test coordinator-cf/test/worker.test.mjs

      # The Worker serves its own copy of the dashboard UI; it must not drift from
      # the canonical one (the deploy script re-syncs it, but a manual edit to one
      # side would go unnoticed otherwise).
      - name: Coordinator UI is in sync
        run: diff -u area/net/static/index.html coordinator-cf/public/index.html
