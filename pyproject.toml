[project]
name = "area"
version = "0.0.0"
description = "AREA — internal AI software factory (OpenHands SDK execution core)"
readme = "README.md"
requires-python = ">=3.12"
# Engine deps are installed + pinned during Phase 0 (see requirements.lock / README).
# OpenHands SDK releases weekly with breaking changes, so we PIN exact versions
# and keep all engine calls behind area/engine (adapter) to contain churn.
dependencies = [
    "openhands-sdk==1.55.1",
    "openhands-tools==1.55.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.uv]
# Reproducibility guard: don't resolve to packages newer than this when locking.
# exclude-newer = "2026-10-17"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["area"]
