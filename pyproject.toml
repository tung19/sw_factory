[project]
name = "area"
version = "0.0.0"
description = "AREA — internal AI software factory (OpenHands SDK execution core)"
readme = "README.md"
requires-python = ">=3.12"
# Engine (OpenHands SDK) is VENDORED in-tree via git subtree under
# vendor/software-agent-sdk (MIT) — AREA owns + can modify it, and `git subtree pull`
# brings upstream fixes. [tool.uv.sources] below points these at the in-tree copy;
# the pip path (scripts/install.sh, CI) installs them editable from vendor/.
# All engine calls stay behind area/engine (adapter) to contain churn.
dependencies = [
    "openhands-sdk==1.55.1",
    "openhands-tools==1.55.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
# Dashboard requirement-doc upload (PDF/Word) parsing.
gui = ["pypdf>=5", "python-docx>=1"]
# Optional deep process-visualization: a Langfuse trace per pipeline run, one
# span per agent run (cost/latency/outcome). Set LANGFUSE_PUBLIC_KEY +
# LANGFUSE_SECRET_KEY (+ LANGFUSE_HOST for self-host) to activate; no-op otherwise.
trace = ["langfuse>=2,<3"]

[project.scripts]
area = "area.cli:main"

[tool.uv]
# Reproducibility guard: don't resolve to packages newer than this when locking.
# exclude-newer = "2026-10-17"

[tool.uv.sources]
# The engine is vendored in-tree (git subtree: vendor/software-agent-sdk). uv
# installs these two from the in-tree copy (editable) instead of PyPI, so edits
# to the vendored SDK take effect immediately. `git subtree pull` updates it.
openhands-sdk = { path = "vendor/software-agent-sdk/openhands-sdk", editable = true }
openhands-tools = { path = "vendor/software-agent-sdk/openhands-tools", editable = true }

[tool.pytest.ini_options]
# AREA's own (dogfood) test suite. Pure orchestrator logic — no live agents.
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
# Lint the factory source + tests only — not the vendored SDK, the generated
# workspace, or the (TypeScript) example apps.
extend-exclude = ["vendor", "workspace", "examples"]
line-length = 100

[tool.ruff.lint]
# Bug-focused rules: pyflakes (F — unused imports/vars, undefined names) + syntax
# (E9). Deliberately NOT the full style suite yet; tighten over time.
select = ["F", "E9"]

[tool.mypy]
# PHASED type-checking: a curated set of already-clean modules, expanded over time
# (full typing of the ~7k-LOC codebase is a gradual effort). CI runs bare `mypy`,
# which reads this `files` list.
python_version = "3.12"
ignore_missing_imports = true
files = [
  "area/paths.py",
  "area/_util.py",
  "area/evidence.py",
  "area/obs.py",
  "area/provenance.py",
  "area/demo.py",
  "area/verify/_runners.py",
  "area/verify/perf.py",
  "area/verify/nfr.py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["area"]
